name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate project files
        run: |
          test -f waqfa-app.html || { echo "::error::ملف waqfa-app.html مش موجود في أول الريبو"; exit 1; }
          rm -rf android www
          mkdir -p www
          cp waqfa-app.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "waqfa-android",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/app": "^6.0.0",
              "@capacitor/core": "^6.2.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.waqfa.app",
            "appName": "وقفة",
            "webDir": "www"
          }
          EOF
          cat > android-patch.py <<'EOF'
          # بيتشغل أوتوماتيك جوه GitHub Actions بعد ما Capacitor يعمل مشروع الأندرويد.
          import os, re

          run = os.environ.get("RUN", "1")
          pkg = "com.waqfa.app"

          # 1) الصلاحيات
          man = "android/app/src/main/AndroidManifest.xml"
          s = open(man, encoding="utf-8").read()
          if "android.permission.CAMERA" not in s:
              add = "".join('    <uses-permission android:name="%s" />\n' % x for x in [
                  "android.permission.CAMERA",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.WAKE_LOCK"])
              add += '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
              assert "</manifest>" in s
              s = s.replace("</manifest>", add + "</manifest>")
              open(man, "w", encoding="utf-8").write(s)

          # 2) الشاشة تفضل منورة (والصفحة بتقفلها لما مفيش تصوير)
          java = """package com.waqfa.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              getBridge().getWebView().addJavascriptInterface(new KeepAwake(), "WaqfaNative");
            }

            private class KeepAwake {
              @JavascriptInterface
              public void keepOn(final boolean on) {
                runOnUiThread(new Runnable() {
                  @Override
                  public void run() {
                    if (on) getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                    else getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  }
                });
              }
            }
          }
          """
          d = "android/app/src/main/java/" + pkg.replace(".", "/")
          os.makedirs(d, exist_ok=True)
          open(d + "/MainActivity.java", "w", encoding="utf-8").write(java)

          # 3) رقم الإصدار يزيد مع كل بناء
          g = "android/app/build.gradle"
          t = open(g, encoding="utf-8").read()
          t = re.sub(r"versionCode\s+\d+", "versionCode " + run, t)
          t = re.sub(r'versionName\s+"[^"]*"', 'versionName "1.0.' + run + '"', t)
          open(g, "w", encoding="utf-8").write(t)
          print("patched OK, build", run)
          EOF

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Patch Android project
        run: python3 android-patch.py
        env:
          RUN: ${{ github.run_number }}

      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk waqfa.apk

      - uses: actions/upload-artifact@v4
        with:
          name: waqfa-apk
          path: waqfa.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Waqfa v${{ github.run_number }}
          files: waqfa.apk
          make_latest: true

      - name: Download link
        run: echo "https://github.com/${{ github.repository }}/releases/latest/download/waqfa.apk" >> "$GITHUB_STEP_SUMMARY"
