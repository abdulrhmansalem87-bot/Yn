<style>

@media (prefers-color-scheme:dark){:root{--bg:#0f1a1f;--card:#18262c;--ink:#e8f0f3;--mute:#93a6af;--line:#2b3d45;--pri:#4fc3c3;--on:#0b1a1a;--amb:#f0b840;--ambbg:#3a2f12;--ok:#5fd18d;--okbg:#14301f;--bad:#ff8a82;--blu:#7db4f0;--blubg:#16293f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,system-ui,sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:26px;font-weight:800;margin:8px 0}
h2{font-size:17px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:17px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--mute);font-size:14px;margin:4px 0 8px}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--blubg);color:var(--blu)}
.b-taken,.b-review,.b-unpaid{background:var(--ambbg);color:var(--amb)}.b-approved{background:var(--okbg);color:var(--ok)}.b-cancelled{background:var(--line);color:var(--mute)}.rd{color:var(--bad);font-weight:700}
.rew{font-weight:800;color:var(--pri)}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
input,select,textarea{width:100%;font:400 16px Cairo,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blu);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:600 15px Cairo,sans-serif;cursor:pointer;background:var(--pri);color:var(--on)}
.ghost{background:none;border:1px solid var(--line);color:var(--ink)}.ok{background:var(--ok);color:#fff}.bad{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.top .sp{flex:1}
video,img{width:100%;max-height:260px;object-fit:contain;border-radius:10px;background:#000;margin-top:8px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}.empty{text-align:center;color:var(--mute);padding:24px;border:1px dashed var(--line);border-radius:14px}
.note{font-size:14px;padding:8px 10px;border-radius:10px;background:var(--ambbg);color:var(--amb);margin-top:8px}
.toast{position:fixed;inset-inline:16px;bottom:16px;max-width:420px;margin:auto;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;text-align:center;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>

function hasMR(){return typeof MediaRecorder!=="undefined"&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia}
function getCam(){return navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:640},height:{ideal:480},frameRate:{ideal:15}},audio:false})}
async function recStart(id){
 if(REC)return;
 if(!hasMR()){toast("المتصفح ده مش بيدعم التصوير. استخدم كروم أو سفاري حديث");return}
 var t=T.filter(function(x){return x.id===id})[0];if(!t)return;
 var pos,st;
 try{pos=await new Promise(function(y,n){navigator.geolocation.getCurrentPosition(y,n,{enableHighAccuracy:true,timeout:15000})})}catch(x){toast("فعّل الموقع عشان نثبت مكانك");return}
 try{st=await getCam()}catch(x){toast("اسمح بالكاميرا");return}
 var mt=MediaRecorder.isTypeSupported("video/webm")?"video/webm":"video/mp4";
 REC={id:id,st:st,mt:mt,t:t,pos:{lat:pos.coords.latitude,lng:pos.coords.longitude},q:[],busy:false,pre:CS[id]||0,done:0,up:0,stopping:false,fin:false,fail:0,err:"",warn:"",lost:false,wl:null,cur:null,t0:0,timer:0,gps:null};
 REC.gps=navigator.geolocation.watchPosition(function(p){if(REC)REC.pos={lat:p.coords.latitude,lng:p.coords.longitude}},function(){},{enableHighAccuracy:true,maximumAge:20000});
 try{if(navigator.wakeLock)REC.wl=await navigator.wakeLock.request("screen")}catch(x){}
 try{if(window.WaqfaNative)WaqfaNative.keepOn(true)}catch(x){}
 bindTrack();seg();draw();
}
function bindTrack(){var X=REC,tr=X.st.getVideoTracks()[0];if(tr)tr.onended=function(){camLost()}}
function camLost(){var X=REC;if(!X||X.stopping)return;X.lost=true;X.warn="الكاميرا وقفت! ارجع للصفحة وسيب الشاشة منورة، أو دوس شغّل الكاميرا";try{if(navigator.vibrate)navigator.vibrate([300,100,300])}catch(e){}}
function seg(){
 var X=REC;if(!X||X.stopping||X.cur)return;
 var tr=X.st.getVideoTracks()[0];if(!tr||tr.readyState!=="live"){camLost();return}
 var mr,ch=[],t0=Date.now();
 try{mr=new MediaRecorder(X.st,{mimeType:X.mt,videoBitsPerSecond:150000})}catch(e){X.warn="مش قادر يبدأ التسجيل";return}
 mr.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
 mr.onstop=function(){clearTimeout(X.timer);var d=Math.min(45,Math.floor((Date.now()-t0)/1000));
  if(ch.length&&d>=1){X.q.push({blob:new Blob(ch,{type:X.mt}),at:new Date(t0).toISOString(),d:d,la:X.pos.lat,lo:X.pos.lng});X.done+=d}
  X.cur=null;if(X.stopping)X.fin=true;else seg();pump()};
 X.cur=mr;X.t0=t0;X.lost=false;X.warn="";mr.start();
 X.timer=setTimeout(function(){if(mr.state==="recording")mr.stop()},SEGMS);
}
async function pump(){
 var X=REC;if(!X||X.busy||!X.q.length)return;X.busy=true;
 try{while(X.q.length){var c=X.q[0],path=U.id+"/"+X.id+"/"+Date.parse(c.at)+(X.mt==="video/webm"?".webm":".mp4");
  var u=await sb.storage.from("proofs").upload(path,c.blob,{contentType:X.mt});
  if(u.error&&!/exists|duplicate|409/i.test(String(u.error.message)+String(u.error.statusCode||""))){X.fail++;X.err=u.error.message;break}
  var r=await sb.rpc("add_chunk",{t:X.id,p:path,a:c.at,d:c.d,la:c.la,lo:c.lo});
  if(r.error){if(/المهمة|المهلة/.test(r.error.message)){recAbort(r.error.message);return}X.fail++;X.err=r.error.message;break}
  X.q.shift();X.up+=c.d;X.fail=0;X.err=""}}
 catch(e){X.fail++;X.err=String(e&&e.message||e)}

}
function recCleanup(X){X.stopping=true;clearTimeout(X.timer);try{if(X.cur&&X.cur.state==="recording"){X.cur.onstop=null;X.cur.stop()}}catch(e){}
 try{X.st.getTracks().forEach(function(t){t.stop()})}catch(e){}
 try{if(X.gps!=null)navigator.geolocation.clearWatch(X.gps)}catch(e){}
 try{if(X.wl)X.wl.release()}catch(e){}
 try{if(window.WaqfaNative)WaqfaNative.keepOn(false)}catch(e){}}
function recAbort(m){var X=REC;if(!X)return;recCleanup(X);REC=null;toast(m);load()}
async function recover(){
 var X=REC;if(!X||X.stopping)return;
 try{if(navigator.wakeLock&&(!X.wl||X.wl.released))X.wl=await navigator.wakeLock.request("screen")}catch(e){}
 var tr=X.st.getVideoTracks()[0];
 if(!tr||tr.readyState==="ended"){try{X.st=await getCam();bindTrack();X.warn="";X.lost=false;X.cur=null;seg();draw()}catch(e){X.warn="الكاميرا واقفة. دوس شغّل الكاميرا"}}
}
async function recFinish(){
 var X=REC;if(!X||X.stopping)return;
 var cur=X.cur?Math.floor((Date.now()-X.t0)/1000):0,need=Math.floor(X.t.hours*3600*0.9),have=X.pre+X.done+cur;
 if(have<need){toast("لسه ناقص "+Math.ceil((need-have)/60)+" دقيقة من وقت الدعاية");return}
 X.stopping=true;toast("جاري إنهاء الرفع...");
 if(X.cur&&X.cur.state==="recording")X.cur.stop();else X.fin=true;
 var w=0;while(!(X.fin&&!X.q.length&&!X.busy)&&w<120&&REC===X){await new Promise(function(r){setTimeout(r,500)});pump();w++}
 if(REC!==X)return;
 if(X.q.length||!X.fin){X.stopping=false;X.fin=false;toast("النت ضعيف ولسه في لقطات ما اترفعتش. فضّل فاتح الصفحة");seg();return}

}

 else if(a==="wprev"){plPlay(PL.i-1)}
 else if(a==="wnext"){plPlay(PL.i+1)}
 else if(a==="wlast"){plPlay(CH.length-1)}
 else if(a==="rate"){if(await rpc("rate",{t:i,s:+b.dataset.s}))toast("شكراً على التقييم");load()}
 else if(a==="idok"||a==="idno"){if(await rpc("review_id",{u:b.dataset.i,ok:a==="idok"}))load()}
 else if(a==="ok"||a==="no"){var nt=a==="no"?v("n-"+i):"";if(a==="no"&&!nt){toast("اكتب سبب الرفض");return}
  if(await rpc("review_task",{t:i,ok:a==="ok",n:nt})){WATCH=null;CH=[];load()}}
 else if(a==="payok"){if(await rpc("admin_pay_ok",{t:i})){toast("اتأكد، المهمة اتعرضت");load()}}
 else if(a==="payno"){var pn=v("pn-"+i);if(!pn){toast("اكتب السبب");return}if(await rpc("admin_pay_no",{t:i,n:pn}))load()}
 else if(a==="paid"){if(await rpc("admin_paid",{t:i,ref:v("rf-"+i)})){toast("اتسجل");load()}}
 else if(a==="refunded"){if(await rpc("admin_refunded",{t:i})){toast("اتسجل");load()}}
 else if(a==="setsave"){var o1=await rpc("set_setting",{key:"commission_pct",val:v("s-c")});if(o1&&await rpc("set_setting",{key:"pay_info",val:v("s-p")})){toast("اتحفظ");load()}}
 else if(a==="purge"){if(!confirm("تمسح كل لقطات المهمة دي؟ مش هتقدر ترجعها."))return;
  var cr=await sb.from("chunks").select("path").eq("task",i).limit(1000),ps=(cr.data||[]).map(function(x){return x.path});
  if(ps.length){var d=await sb.storage.from("proofs").remove(ps);if(d.error){toast("فشل المسح");return}}
  if(await rpc("admin_purge",{t:i})){toast("اتمسحت");load()}}
});

 if(t.id==="i-c"||t.id==="i-s"){IDF[t.id==="i-c"?"c":"s"]=t.files[0]||null;draw()}
 else if(t.id&&t.id.indexOf("p-")===0&&t.type==="file"){var k=+t.id.slice(2);if(t.files[0])PF[k]=t.files[0];else delete PF[k];draw()}});

try{var CAP=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(CAP)CAP.addListener("backButton",function(){if(REC){toast("الدوام شغال. استخدم زر إنهاء الدوام");return}if(WATCH){WATCH=null;CH=[];load();return}if(BELL){BELL=false;draw();return}CAP.exitApp()})}catch(e){}

setInterval(function(){
 var now=Date.now(),i,x;tick++;
 if(OFFER&&now>=OFFER.end){OFFER=null;toast("العرض انتهى");draw()}
 x=$("oc");if(x&&OFFER)x.textContent=Math.ceil((OFFER.end-now)/1000);
 if(REC){x=$("rt");if(x)x.textContent=hms(REC.pre+REC.done+(REC.cur?Math.floor((now-REC.t0)/1000):0));
  x=$("rs");if(x)x.innerHTML=recStatus();
  if(!REC.stopping){var tr=REC.st.getVideoTracks()[0];if(!REC.cur&&tr&&tr.readyState==="live")seg();
   if(tick%5===0){pump();if(document.visibilityState==="visible")recover()}}}
 x=document.querySelectorAll("[data-dl]");for(i=0;i<x.length;i++)x[i].textContent=mmss(+x[i].dataset.dl-now);
 x=document.querySelectorAll("[data-g]");for(i=0;i<x.length;i++)if(now>+x[i].dataset.g)x[i].hidden=true;
 if(tick%20===0&&WATCH)refreshWatch();
 if(tick%30===0&&U)soft();
},1000);
